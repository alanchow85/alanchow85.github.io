<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Data with API Key</title>
</head>
<body>
    <h1>Submit Data</h1>
    <form id="myForm">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>
        <button type="submit">Submit</button>
    </form>

    <div id="response"></div>

    <script>
        document.getElementById('myForm').addEventListener('submit', async function(event) {
            event.preventDefault(); // Prevent default form submission

            const apiKey = 'YOUR_API_KEY_HERE'; // Replace with your actual API key
            const apiUrl = 'https://api.example.com/submit'; // Replace with your API endpoint

            const formData = new FormData(this); // Get form data
            
            //const data = Object.fromEntries(formData.entries()); // Convert to plain object
            
            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}` // Include API key in Authorization header
                        // Or a custom header, e.g., 'X-API-KEY': apiKey
                    },
                    //body: JSON.stringify(data) // Send data as JSON
                    body: {
                              "assignees": [
                                "string"
                              ],
                              "fields": {},
                              "status": "string",
                              "tags": [
                                "string"
                              ],
                              "type": "string"
                            }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                document.getElementById('response').textContent = 'Success: ' + JSON.stringify(result);
            } catch (error) {
                document.getElementById('response').textContent = 'Error: ' + error.message;
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
