<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini CodePen</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    height:100vh;
    display:flex;
    background:#1e1e1e;
    color:white;
}

.container{
    display:flex;
    width:100%;
}

.editor-panel{
    width:50%;
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:10px;
    background:#252526;
}

.editor{
    flex:1;
    display:flex;
    flex-direction:column;
}

.editor label{
    background:#333;
    padding:8px;
    font-weight:bold;
}

textarea{
    flex:1;
    background:#1e1e1e;
    color:#fff;
    border:none;
    resize:none;
    padding:10px;
    font-family:Consolas, monospace;
    font-size:14px;
}

.preview-panel{
    width:50%;
    border-left:2px solid #333;
}

iframe{
    width:100%;
    height:100%;
    background:white;
    border:none;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:5px;
}

button{
    background:#0078d4;
    color:white;
    border:none;
    padding:8px 16px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#106ebe;
}
</style>
</head>

<body>

<div class="container">

    <div class="editor-panel">

        <div class="header">
            <h2>Alan CodePen</h2>
            <button onclick="runCode()">Run ▶</button>
        </div>

        <div class="editor">
            <label>HTML</label>
            <textarea id="html">
<h1>Hello World</h1>
<p>Edit code and see live preview.</p>
            </textarea>
        </div>

        <div class="editor">
            <label>CSS</label>
            <textarea id="css">
body{
    font-family:Arial;
    text-align:center;
    padding:30px;
}

h1{
    color:royalblue;
}
            </textarea>
        </div>

        <div class="editor">
            <label>JavaScript</label>
            <textarea id="js">
console.log("Welcome!");
            </textarea>
        </div>

    </div>

    <div class="preview-panel">
        <iframe id="preview"></iframe>
    </div>

</div>

<script>

function runCode(){

    const html = document.getElementById('html').value;
    const css = document.getElementById('css').value;
    const js = document.getElementById('js').value;

    const preview = document.getElementById('preview');

    const source = `
        <!DOCTYPE html>
        <html>
        <head>
            <style>
                ${css}
            </style>
        </head>
        <body>
            ${html}

            <script>
                try{
                    ${js}
                }catch(err){
                    document.body.innerHTML +=
                    '<pre style="color:red">JS Error: ' + err + '</pre>';
                }
            <\/script>
        </body>
        </html>
    `;

    preview.srcdoc = source;
}

document.querySelectorAll('textarea').forEach(textarea=>{
    textarea.addEventListener('input', runCode);
});

runCode();

</script>

</body>
</html>
